{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<section class="tarjeta angosta">
    <h1>{{ titulo }}</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_div }}
        <div class="acciones">
            <button type="submit" class="boton">Guardar</button>
            <a href="javascript:history.back()" class="boton secundario">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
