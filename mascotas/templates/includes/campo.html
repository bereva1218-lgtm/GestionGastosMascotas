<div class="campo{% if ancho %} campo--{{ ancho }}{% endif %}{% if field.errors %} campo--error{% endif %}">
    <label class="campo__etiqueta" for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %}<span class="campo__requerido" aria-hidden="true">*</span>{% endif %}
    </label>
    {% if prefijo or sufijo %}
    <div class="campo__grupo">
        {% if prefijo %}<span class="campo__adorno">{{ prefijo }}</span>{% endif %}
        {{ field }}
        {% if sufijo %}<span class="campo__adorno">{{ sufijo }}</span>{% endif %}
    </div>
    {% else %}
    {{ field }}
    {% endif %}
    {% if field.help_text %}<p class="campo__ayuda" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</p>{% endif %}
    {% for error in field.errors %}<p class="campo__error" role="alert">{{ error }}</p>{% endfor %}
</div>
